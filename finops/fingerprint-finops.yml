specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Fingerprint
providerId: fingerprint
created: '2026-06-25'
modified: '2026-06-25'
reconciled: false
tags:
- Device Identification
- Fraud Prevention
- Bot Detection
- Smart Signals
- Identity
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Fingerprint spend. Fingerprint bills usage-based per API call
  (identification event), with a free monthly allotment, a bundled Pro Plus plan
  plus per-1,000 overage, and custom Enterprise pricing. Smart Signals are
  included with the identification event; cost is driven primarily by API-call
  volume across web, iOS, and Android.
notes: >-
  Per-plan included volumes and overage rates are subject to change; verify
  against the Fingerprint pricing page during reconciliation.
sources:
- https://fingerprint.com/pricing/
- https://dev.fingerprint.com/docs/billing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Fingerprint
serviceCategory: Identity and Fraud Prevention
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Fingerprint Server API
  ServiceCategory: Identity and Fraud Prevention
  ProviderName: Fingerprint
  PublisherName: Fingerprint
  InvoiceIssuerName: Fingerprint
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: api_calls
  description: Identification events (API calls) generated by the agent and retrievable via the Server API, billed per call after the included allotment.
  unit: api_calls
  aggregation: sum
  dimensions:
  - workspace
  - platform
- name: overage_api_calls
  description: API calls beyond the plan allotment, billed per 1,000 requests.
  unit: api_calls
  aggregation: sum
  dimensions:
  - workspace
  - platform
- name: smart_signals
  description: Smart Signal results (bot, VPN, proxy, tampering, etc.) returned within identification events; included with the event.
  unit: signals
  aggregation: sum
  dimensions:
  - workspace
  - signal
principles:
- name: Visibility
  description: Pull Fingerprint usage from the dashboard and billing exports; inspect API-call burn by platform (web, iOS, Android).
- name: Allocation
  description: Tag API keys and use linkedId per workload/team to map identification volume to internal cost centers.
- name: Optimization
  description: Identify only on high-value flows (login, checkout, signup), use Sealed Results to avoid extra round-trips, and avoid redundant client-side identification calls.
- name: Accountability
  description: Assign owners per environment/key and review monthly API-call volume against plan allotment and overage budget.
maintainers:
- FN: Kin Lane
